<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bundleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title Badge -->
  <rect x="30" y="24" width="220" height="28" rx="6" fill="#334155"/>
  <text x="40" y="43" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">BEFORE OPTIMIZATION</text>
  <text x="30" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Monolithic Single Bundle (Loaded Upfront)</text>
  <text x="30" y="104" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Initial Visit downloads all routes, components, and heavy libraries upfront</text>

  <!-- Initial Request Box -->
  <g filter="url(#shadow)">
    <rect x="40" y="140" width="180" height="150" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="130" y="175" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Browser Visit</text>
    <text x="130" y="200" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Route: /</text>
    <rect x="60" y="225" width="140" height="36" rx="6" fill="#334155"/>
    <text x="130" y="248" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">First Page Load</text>
  </g>

  <!-- Arrow -->
  <path d="M 230 215 L 290 215" stroke="#ef4444" stroke-width="4" marker-end="url(#arrow)"/>
  <polygon points="290,210 305,215 290,220" fill="#ef4444"/>

  <!-- Monolithic Bundle Box -->
  <g filter="url(#shadow)">
    <rect x="315" y="130" width="445" height="175" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Header of Bundle -->
    <rect x="315" y="130" width="445" height="42" rx="14" fill="url(#bundleGrad)"/>
    <text x="335" y="157" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">index.bundle.js (457.34 kB │ gzip: 149.50 kB)</text>
    <text x="735" y="157" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">Slow Initial Render</text>

    <!-- Components packed together -->
    <g transform="translate(330, 186)">
      <rect x="0" y="0" width="95" height="50" rx="8" fill="#334155" stroke="#64748b"/>
      <text x="47" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Home</text>
      <text x="47" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">5.6 kB</text>

      <rect x="105" y="0" width="95" height="50" rx="8" fill="#334155" stroke="#64748b"/>
      <text x="152" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Projects</text>
      <text x="152" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">3.8 kB</text>

      <rect x="210" y="0" width="95" height="50" rx="8" fill="#334155" stroke="#64748b"/>
      <text x="257" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Contact</text>
      <text x="257" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">3.7 kB</text>

      <rect x="315" y="0" width="100" height="50" rx="8" fill="#b91c1c" stroke="#f87171"/>
      <text x="365" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Chart.js</text>
      <text x="365" y="40" fill="#fecaca" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">180.6 kB (HEAVY)</text>
    </g>

    <text x="537" y="285" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">❌ Entire payload must be downloaded and parsed before first pixel renders!</text>
  </g>
</svg>
