<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="chunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Title Badge -->
  <rect x="30" y="22" width="220" height="28" rx="6" fill="#065f46"/>
  <text x="40" y="41" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AFTER CODE-SPLITTING &amp; LAZY LOADING</text>
  <text x="30" y="76" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Route-Based &amp; Component-Level Dynamic Splitting</text>
  <text x="30" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Initial bundle reduced from 457 kB to 262 kB (-41.4%). Chunks load strictly on user navigation.</text>

  <!-- Initial Visit -->
  <g filter="url(#shadow2)">
    <rect x="40" y="130" width="240" height="110" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="40" y="130" width="240" height="34" rx="12" fill="url(#mainGrad)"/>
    <text x="160" y="153" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Initial Visit (/)</text>
    <text x="55" y="186" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">index.bundle.js</text>
    <text x="55" y="206" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">262.5 kB (Core Shell)</text>
    <text x="55" y="224" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">⚡ Fast First Contentful Paint</text>
  </g>

  <!-- Arrows from Browser Navigation -->
  <g stroke="#10b981" stroke-width="2" fill="none">
    <!-- To Home -->
    <path d="M 280 185 L 360 150"/>
    <!-- To Projects -->
    <path d="M 280 185 L 360 220"/>
    <!-- To Analytics -->
    <path d="M 280 185 L 360 290"/>
    <!-- To Contact -->
    <path d="M 280 185 L 360 360"/>
  </g>

  <!-- Chunk 1: Home -->
  <g filter="url(#shadow2)">
    <rect x="365" y="125" width="455" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
    <rect x="375" y="135" width="130" height="38" rx="6" fill="#334155"/>
    <text x="440" y="158" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Route: /</text>
    <text x="525" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Home-DQduJJxm.js</text>
    <text x="525" y="168" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Size: 5.64 kB &bull; Loaded on first visit for task board</text>
  </g>

  <!-- Chunk 2: Projects -->
  <g filter="url(#shadow2)">
    <rect x="365" y="195" width="455" height="58" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="375" y="205" width="130" height="38" rx="6" fill="#065f46"/>
    <text x="440" y="228" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Route: /projects</text>
    <text x="525" y="220" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Projects-B5ynT97_.js</text>
    <text x="525" y="238" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Size: 3.81 kB &bull; Loaded ONLY when /projects is clicked</text>
  </g>

  <!-- Chunk 3: Analytics & Chart.js -->
  <g filter="url(#shadow2)">
    <rect x="365" y="265" width="455" height="66" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="375" y="275" width="130" height="46" rx="6" fill="#78350f"/>
    <text x="440" y="303" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Route: /analytics</text>
    <text x="525" y="290" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Analytics-C3lkJbxs.js (3.15 kB)</text>
    <text x="525" y="308" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11">chart-vendor.js (180.6 kB) &bull; Lazy-loaded heavy chart</text>
  </g>

  <!-- Chunk 4: Contact -->
  <g filter="url(#shadow2)">
    <rect x="365" y="343" width="455" height="58" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="375" y="353" width="130" height="38" rx="6" fill="#312e81"/>
    <text x="440" y="376" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Route: /contact</text>
    <text x="525" y="368" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Contact-BBNVfo6n.js</text>
    <text x="525" y="386" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Size: 3.67 kB &bull; Loaded ONLY when /contact is clicked</text>
  </g>

  <!-- Footer Indicator -->
  <text x="160" y="275" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✔ Suspense with Fallback UI</text>
  <text x="160" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">300ms flicker prevention delay</text>
</svg>
